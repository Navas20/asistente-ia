services:
  artenisa-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artenisa-backend
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PYTHONUNBUFFERED=1
      - AUTH_TOKEN=${AUTH_TOKEN:-cambia-este-token-urgentemente}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:?OPENROUTER_API_KEY es obligatoria}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - API_BASE_URL=https://openrouter.ai/api/v1
      - DB_PATH=/data/conversations.db
      - UPLOAD_DIR=/data/uploads
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS}
      - KALI_TOOLS_URL=http://artenisa-kali-tools:9001
    volumes:
      - artenisa_data:/data
    # restart: unless-stopped
    cpuset: "4-5"
    cpus: "1.0"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  artenisa-telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artenisa-telegram-bot
    working_dir: /app
    command: python3 -u telegram_bot.py
    environment:
      - PYTHONUNBUFFERED=1
      - API_URL=http://artenisa-backend:8000
      - AUTH_TOKEN=${AUTH_TOKEN:-cambia-este-token-urgentemente}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      artenisa-backend:
        condition: service_healthy
    # restart: unless-stopped
    cpus: "0.5"
    mem_limit: 256m

  artenisa-kali-tools:
    build:
      context: .
      dockerfile: docker/kali.Dockerfile
    container_name: artenisa-kali-tools
    expose:
      - "9001"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - kali-tools-data:/tmp
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # restart: unless-stopped
    cpuset: "8-9"
    cpus: "2.0"
    mem_limit: 512m

  artenisa-n8n:
    image: n8nio/n8n:2.37.7
    container_name: artenisa-n8n
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - N8N_RUNNERS_ENABLED=false
      - GENERIC_TIMEZONE=America/Argentina/Buenos_Aires
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      artenisa-backend:
        condition: service_healthy
    # restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g

volumes:
  artenisa_data:
  kali-tools-data:
  n8n_data:
