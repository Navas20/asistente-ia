version: "3.9"

services:
  artenisa-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artenisa-backend
    ports:
      - "8000:8000"
    environment:
      - AUTH_TOKEN=${AUTH_TOKEN:-cambia-este-token-urgentemente}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-deepseek/deepseek-chat:free}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DB_PATH=/data/conversations.db
      - UPLOAD_DIR=/data/uploads
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS}
    volumes:
      - artenisa_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  artenisa-telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artenisa-telegram-bot
    entrypoint: []
    command: python3 telegram_bot.py
    environment:
      - API_URL=http://artenisa-backend:8000
      - AUTH_TOKEN=${AUTH_TOKEN:-cambia-este-token-urgentemente}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS}
    depends_on:
      artenisa-backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  artenisa_data:
