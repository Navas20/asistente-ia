services:
  artenisa-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artenisa-backend
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PYTHONUNBUFFERED=1
      - AUTH_TOKEN=${AUTH_TOKEN:-cambia-este-token-urgentemente}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-artenisa}
      - OLLAMA_HOST=http://artenisa-ollama:11434
      - OLLAMA_NUM_PREDICT=400
      - OLLAMA_TIMEOUT=1800
      - OLLAMA_MAX_RETRIES=1
      - DB_PATH=/data/conversations.db
      - UPLOAD_DIR=/data/uploads
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS}
      - KALI_TOOLS_URL=http://artenisa-kali-tools:9001
      - IMAP_SERVER=${IMAP_SERVER}
      - IMAP_PORT=${IMAP_PORT:-993}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT:-587}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
    volumes:
      - artenisa_data:/data
    restart: unless-stopped
    cpuset: "4-5"
    cpus: "1.0"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      artenisa-ollama:
        condition: service_started

  artenisa-ollama:
    build:
      context: docker/ollama
      dockerfile: Dockerfile
    image: artenisa-ollama:0.33.3-mmap
    container_name: artenisa-ollama
    expose:
      - "11434"
    environment:
      - OMP_NUM_THREADS=4
      - OLLAMA_NUM_PARALLEL=1
      - LLAMA_ARG_THREADS=${OLLAMA_THREADS:-8}
    ipc: host
    volumes:
      - /var/lib/ollama:/root/.ollama/models
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    cpuset: "${OLLAMA_CPUSET:-0-7}"
    cpus: "${OLLAMA_CPUS:-8}"
    mem_limit: 8g

  artenisa-telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artenisa-telegram-bot
    working_dir: /app
    command: python3 -u telegram_bot.py
    environment:
      - PYTHONUNBUFFERED=1
      - API_URL=http://artenisa-backend:8000
      - AUTH_TOKEN=${AUTH_TOKEN:-cambia-este-token-urgentemente}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      artenisa-backend:
        condition: service_healthy
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 256m

  artenisa-kali-tools:
    build:
      context: .
      dockerfile: docker/kali.Dockerfile
    container_name: artenisa-kali-tools
    expose:
      - "9001"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - kali-tools-data:/tmp
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    cpuset: "8-9"
    cpus: "2.0"
    mem_limit: 512m

volumes:
  artenisa_data:
  kali-tools-data:
