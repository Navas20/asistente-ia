version: "3.9"

services:
  jarvis:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - AUTH_TOKEN=${AUTH_TOKEN:-cambia-este-token-urgentemente}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-nex-agi/nex-n2-pro:free}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DB_PATH=/data/conversations.db
      - UPLOAD_DIR=/data/uploads
    volumes:
      - jarvis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    command: python3 /app/telegram_bot.py
    environment:
      - API_URL=http://jarvis:8000
      - AUTH_TOKEN=${AUTH_TOKEN:-cambia-este-token-urgentemente}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - ALLOWED_USER_ID=${ALLOWED_USER_ID}
    depends_on:
      jarvis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  jarvis_data:
