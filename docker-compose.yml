services:
  artenisa-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artenisa-backend
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PYTHONUNBUFFERED=1
      - AUTH_TOKEN=${AUTH_TOKEN:-cambia-este-token-urgentemente}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-deepseek/deepseek-chat:free}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DB_PATH=/data/conversations.db
      - UPLOAD_DIR=/data/uploads
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS}
      - KALI_TOOLS_URL=http://artenisa-kali-tools:9001
    volumes:
      - artenisa_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  artenisa-telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artenisa-telegram-bot
    working_dir: /app
    command: python3 -u telegram_bot.py
    environment:
      - PYTHONUNBUFFERED=1
      - API_URL=http://artenisa-backend:8000
      - AUTH_TOKEN=${AUTH_TOKEN:-cambia-este-token-urgentemente}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      artenisa-backend:
        condition: service_healthy
    restart: unless-stopped

  artenisa-kali-tools:
    build:
      context: .
      dockerfile: docker/kali.Dockerfile
    container_name: artenisa-kali-tools
    expose:
      - "9001"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - kali-tools-data:/tmp
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  artenisa_data:
  kali-tools-data:
